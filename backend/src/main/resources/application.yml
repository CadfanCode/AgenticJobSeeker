spring:
  application:
    name: jobseeker
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5433/job_db
    username: jobseeker
    password: jobseeker
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

jobseeker:
  ingest:
    enabled: true
    schedule-cron: "0 0 */6 * * *"
    user-agent: "AgenticJobSeeker/0.1 (+personal job search; contact caiowain@gmail.com)"
    request-timeout-seconds: 20
    per-host-delay-millis: 500
    max-tenant-failures: 5
  sources:
    jobtech:
      base-url: https://jobsearch.api.jobtechdev.se
      page-size: 100
      max-offset: 2000
