spring:
  application:
    name: jobseeker
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5433/job_db
    username: jobseeker
    password: jobseeker
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

jobseeker:
  ingest:
    enabled: true
    schedule-cron: "0 0 */6 * * *"
    user-agent: "AgenticJobSeeker/0.1 (+personal job search; contact caiowain@gmail.com)"
    request-timeout-seconds: 20
    per-host-delay-millis: 500
    max-tenant-failures: 5
  profile:
    max-upload-bytes: 10485760
  select:
    max-bullets-per-requirement: 3
  tailor:
    request-timeout-seconds: 300
  sources:
    jobtech:
      base-url: https://jobsearch.api.jobtechdev.se
      page-size: 100
      max-offset: 2000

spring.ai.ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  init:
    pull-model-strategy: never
  chat:
    options:
      model: ${OLLAMA_MODEL:qwen2.5:7b-instruct}
      temperature: 0.2
      num-ctx: 8192
      num-predict: 600

# The model is a local process on this machine: if it is not listening, it is not
# starting in the next twenty minutes either. Spring AI defaults to 10 attempts with a
# 2s initial backoff and a x5 multiplier capped at 3 minutes, so a refused connection
# to localhost retried for ~20 minutes behind a spinner promising one to two. One
# attempt turns that into an immediate 503, which is what the API contract says
# happens when Ollama is unreachable. Guard rejections are retried separately, in
# TailoringService and DeepFitService, and are unaffected by this.
spring.ai.retry:
  max-attempts: 1
