services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: jobseeker-postgres
    environment:
      POSTGRES_DB: job_db
      POSTGRES_USER: jobseeker
      POSTGRES_PASSWORD: jobseeker
    ports:
      - '5433:5432'
    volumes:
      - jobseeker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobseeker -d job_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jobseeker-pgdata:
